<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodLoop - Surplus Food Sharing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>FoodLoop</h1>
        <button id="openModalBtn" class="post-btn">+ Post Surplus Food</button>
    </header>

    <main>
        <!-- Search and Filter Controls -->
        <div class="controls-container">
            <input type="text" id="searchInput" placeholder="Search food items or location..." class="search-input">
            
            <div class="filter-container">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Bakery">Bakery</button>
                <button class="filter-btn" data-category="Meals">Meals</button>
                <button class="filter-btn" data-category="Produce">Produce</button>
            </div>
        </div>

        <section class="listings-container" id="listingsContainer">
            <!-- Dynamic food cards or empty state will appear here -->
        </section>
    </main>

    <!-- Modal Container -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn">&times;</button>
            <h2>Post Surplus Food</h2>
            <form id="foodForm">
                <input type="text" id="titleInput" placeholder="Food Title" required>
                <input type="text" id="quantityInput" placeholder="Quantity (e.g., 5 meals)" required>
                <input type="text" id="locationInput" placeholder="Location" required>
                <input type="text" id="categoryInput" placeholder="Category (e.g., Bakery, Meals, Produce)" required>
                <button type="submit" class="submit-btn">Submit Listing</button>
            </form>
        </div>
    </div>

    <script src="form.js"></script>
</body>
</html>
